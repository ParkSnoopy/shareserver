{{define "base_top"}}
<!doctype html>
<html lang="{{.Language}}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>{{.Title}}</title>
    <link rel="icon" href="/static/img/favicon.ico" sizes="any">
    <link rel="stylesheet" href="/static/css/app.css">
  </head>
  <body>
    <nav class="tabs">
      <a class="logo" href="/">share://</a>
      <a href="/upload" data-i18n="nav.upload">{{.T "nav.upload"}}</a>
      <a href="/admin" data-i18n="nav.admin">{{.T "nav.admin"}}</a>
      {{if .Admin}}
        <form method="post" action="/admin/logout">
          <input type="hidden" name="csrf" value="{{.CSRF}}">
          <button data-i18n="nav.logout">{{.T "nav.logout"}}</button>
        </form>
      {{end}}
    </nav>
    <main class="shell">
{{end}}

{{define "base_bottom"}}
    </main>
    <script type="module" src="/static/js/i18n.js"></script>
  </body>
</html>
{{end}}
