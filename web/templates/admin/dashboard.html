{{ define "admin_dashboard.html" }}
{{ template "base_top" . }}
<div class="grid">
	<div class="row">
		<span>01</span>
		<h1 data-i18n="admin.title"># Admin</h1>
	</div>

	<div class="row">
		<span>02</span>
		<p
			data-i18n="admin.stored"
			data-i18n-vars='{"used":"{{ mb .Used }}","cap":"{{ mb .Cap }}"}'
		>
			stored {{ mb .Used }} / {{ mb .Cap }}
		</p>
	</div>

	<div class="row">
		<span>03</span>
		<p
			data-i18n="admin.counts"
			data-i18n-vars='{"active":"{{ .Active }}","expired":"{{ .Expired }}","purged":"{{ .Purged }}"}'
		>
			active {{ .Active }} · expired {{ .Expired }} · purged {{ .Purged }}
		</p>
	</div>

	<div class="row">
		<span>04</span>
		<div class="section-rule"></div>
	</div>

	<div class="row">
		<span>05</span>
		<h1 data-i18n="admin.actionsTitle"># Actions</h1>
	</div>

	<div class="row">
		<span>06</span>
		<p>
			<a href="/admin/shares" data-i18n="admin.inspectShares"
				>inspect shares →</a
			>
		</p>
	</div>
</div>
{{ template "base_bottom" . }}
{{ end }}
