name: shareserver

services:
  shareserver:
    image: ghcr.io/parksnoopy/shareserver:v0.2.9
    restart: unless-stopped
    env_file: ../.env
    environment:
      DEBUG: "false"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}"
      ANUBIS_BIND: "127.0.0.1:8080"
      ANUBIS_USE_REMOTE_ADDRESS: "false"
      ANUBIS_DIFFICULTY: "${ANUBIS_DIFFICULTY:-4}"
      DB_PATH: /app/data/shareserver.db
      BLOB_DIR: /app/data/blobs
      TRUST_PROXY_HEADERS: "true"
    # Caddy -> Anubis :8080 -> Shareserver :8081, all on shared loopback.
    ports:
      - "${HTTPS_PORT:-8443}:8443"
    volumes:
      - shareserver-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:mode=1777,noexec,nosuid
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/healthz && wget -q -O /dev/null http://127.0.0.1:8081/api/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  https:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    user: "${HTTPS_UID:-1000}:${HTTPS_GID:-1000}"
    network_mode: "service:shareserver"
    depends_on:
      shareserver:
        condition: service_healthy
        restart: true
    volumes:
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../data/tls
        target: /certs
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /data:mode=1777,noexec,nosuid
      - /config:mode=1777,noexec,nosuid
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  shareserver-data: